<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laser Diode VR Lab</title>

  <!-- 1. Style file -->
  <link rel="stylesheet" href="css/main.css">

  <!-- 2. VR Frameworks -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  <!-- Chart.js to draw graphs in VR -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- 3. Physics Script -->
  <script src="js/main.js" defer></script>
</head>
<body>

  <!-- Instructions when viewed on PC -->
  <div class="guide-box">
    <strong>Laser Diode VR Lab</strong><br>
    • <strong>Walk:</strong> W, A, S, D / Left VR Thumbstick<br>
    • <strong>Look:</strong> Drag Mouse / Headset movement<br>
    • <strong>Interact:</strong> Click the buttons on the table
  </div>

  <!-- Hidden canvases that feed graphs to the 3D screens -->
  <div class="offscreen-canvas">
    <canvas id="liChartCanvas" width="512" height="384"></canvas>
    <canvas id="specChartCanvas" width="512" height="384"></canvas>
  </div>

  <!-- 3D VR SCENE -->
  <a-scene xr-mode-ui="XRMode: xr">

    <!-- Lights -->
    <a-entity light="type: ambient; color: #777; intensity: 1"></a-entity>
    <a-entity light="type: point; color: #fff; intensity: 1.2" position="0 3.2 -1"></a-entity>

    <!-- Lab Room (Floor, Ceiling, Walls) -->
    <a-plane position="0 0 0" rotation="-90 0 0" width="10" height="10" color="#262d3d"></a-plane>
    <a-plane position="0 3.5 0" rotation="90 0 0" width="10" height="10" color="#111827"></a-plane>
    <a-box position="0 1.75 -5" width="10" height="3.5" depth="0.1" color="#1f2735"></a-box>
    <a-box position="0 1.75 5" width="10" height="3.5" depth="0.1" color="#1f2735"></a-box>
    <a-box position="-5 1.75 0" width="0.1" height="3.5" depth="10" color="#18202d"></a-box>
    <a-box position="5 1.75 0" width="0.1" height="3.5" depth="10" color="#18202d"></a-box>

    <!-- Laser Safety Warning Sign -->
    <a-box position="0 2.4 -4.9" width="1.2" height="0.7" depth="0.02" color="#f59e0b">
      <a-text value="CAUTION: LASER LAB\nAVOID DIRECT EYE EXPOSURE" align="center" position="0 0 0.02" width="2" color="#000"></a-text>
    </a-box>

    <!-- Side Bench / Counter -->
    <a-box position="3.8 0.45 -1.2" width="1.2" height="0.9" depth="2.5" color="#334155"></a-box>

    <!-- CENTRAL OPTICAL TABLE -->
    <a-entity position="0 0 -1.5">
      <!-- Breadboard Tabletop & Legs -->
      <a-box position="0 0.85 0" width="2.4" height="0.08" depth="1.2" color="#111827"></a-box>
      <a-cylinder position="-1 0.42 -0.45" radius="0.05" height="0.85" color="#0f172a"></a-cylinder>
      <a-cylinder position="1 0.42 -0.45" radius="0.05" height="0.85" color="#0f172a"></a-cylinder>
      <a-cylinder position="-1 0.42 0.45" radius="0.05" height="0.85" color="#0f172a"></a-cylinder>
      <a-cylinder position="1 0.42 0.45" radius="0.05" height="0.85" color="#0f172a"></a-cylinder>

      <!-- Laser Driver Unit with LCD Screen -->
      <a-box position="-0.75 1.05 -0.2" width="0.45" height="0.25" depth="0.3" color="#334155">
        <a-text value="LD CONTROLLER" position="-0.18 0.09 0.16" width="0.7" color="#cbd5e1"></a-text>
        <a-plane position="0 0.01 0.155" width="0.36" height="0.1" color="#020617">
          <a-text id="lcd-display" value="I: 0.0 mA\nP: 0.00 mW" position="-0.15 0 0.01" width="0.8" color="#22c55e"></a-text>
        </a-plane>
      </a-box>

      <!-- Laser Diode Mount -->
      <a-cylinder position="-0.35 0.95 0" radius="0.02" height="0.12" color="#64748b"></a-cylinder>
      <a-cylinder position="-0.35 1.02 0" radius="0.04" height="0.15" rotation="0 0 90" color="#475569"></a-cylinder>

      <!-- Collimating Lens -->
      <a-cylinder position="-0.05 0.95 0" radius="0.02" height="0.12" color="#64748b"></a-cylinder>
      <a-torus position="-0.05 1.02 0" radius="0.035" radius-tubular="0.007" rotation="0 90 0" color="#334155"></a-torus>
      <!-- Photodetector Sensor -->
      <a-cylinder position="0.55 0.95 0" radius="0.02" height="0.12" color="#64748b"></a-cylinder>
      <a-cylinder position="0.55 1.02 0" radius="0.045" height="0.15" rotation="0 0 90" color="#334155"></a-cylinder>

      <!-- Red Laser Beam (Grows bright when lasing) -->
      <a-cylinder id="laser-beam" position="0.1 1.02 0" rotation="0 0 90" radius="0.003" height="0.8" color="#ff0000" material="shader: flat; opacity: 0.0; transparent: true"></a-cylinder>

      <!-- 3D Monitor 1: L-I Curve -->
      <a-entity position="-0.45 1.5 -0.35" rotation="10 12 0">
        <a-box width="0.65" height="0.48" depth="0.02" color="#1e293b"></a-box>
        <a-plane id="li-screen" position="0 0 0.012" width="0.61" height="0.44" material="src: #liChartCanvas; shader: flat;"></a-plane>
      </a-entity>

      <!-- 3D Monitor 2: Spectrum -->
      <a-entity position="0.35 1.5 -0.35" rotation="10 -12 0">
        <a-box width="0.65" height="0.48" depth="0.02" color="#1e293b"></a-box>
        <a-plane id="spec-screen" position="0 0 0.012" width="0.61" height="0.44" material="src: #specChartCanvas; shader: flat;"></a-plane>
      </a-entity>

      <!-- Clickable Control Buttons on Table -->
      <a-entity position="0 0.95 0.4">
        <!-- -5 mA -->
        <a-box id="btn-decrease" class="clickable" position="-0.22 0 0" width="0.14" height="0.04" depth="0.08" color="#ef4444">
          <a-text value="- 5 mA" align="center" position="0 0.025 0" rotation="-90 0 0" width="0.8" color="#ffffff"></a-text>
        </a-box>
        <!-- +1 mA -->
        <a-box id="btn-step-fine" class="clickable" position="-0.06 0 0" width="0.14" height="0.04" depth="0.08" color="#0284c7">
          <a-text value="+ 1 mA" align="center" position="0 0.025 0" rotation="-90 0 0" width="0.8" color="#ffffff"></a-text>
        </a-box>
        <!-- +5 mA -->
        <a-box id="btn-increase" class="clickable" position="0.1 0 0" width="0.14" height="0.04" depth="0.08" color="#10b981">
          <a-text value="+ 5 mA" align="center" position="0 0.025 0" rotation="-90 0 0" width="0.8" color="#ffffff"></a-text>
        </a-box>
        <!-- RESET -->
        <a-box id="btn-reset" class="clickable" position="0.25 0 0" width="0.12" height="0.04" depth="0.08" color="#64748b">
          <a-text value="RESET" align="center" position="0 0.025 0" rotation="-90 0 0" width="0.7" color="#ffffff"></a-text>
        </a-box>
      </a-entity>
    </a-entity>

    <!-- THEORY & LIVE STATUS WHITEBOARD (Left side of bench) -->
    <a-entity position="-1.9 1.7 -1.3" rotation="0 38 0">
      <a-box position="0 0 0" width="1.6" height="1.4" depth="0.03" color="#0f172a"></a-box>
      <a-plane position="0 0 0.016" width="1.54" height="1.34" color="#ffffff"></a-plane>

      <a-text value="EXPERIMENT THEORY & STATUS" position="-0.72 0.58 0.02" width="1.4" color="#0f172a" style="bold"></a-text>
      <a-text value="1. L-I Characteristic:\n   - Below Ith (25mA): Weak spontaneous emission (LED mode).\n   - Above Ith: Stimulated emission causes sharp linear rise in power.\n\n2. Spectral Narrowing:\n   - Broad spectrum below threshold (FWHM ~35nm).\n   - Collapses into a sharp peak (<1nm) once lasing starts."
              position="-0.72 0.22 0.02" width="1.35" color="#1e293b" baseline="top"></a-text>

      <!-- Live state text -->
      <a-plane position="0 -0.42 0.02" width="1.44" height="0.38" color="#f1f5f9">
        <a-text id="theory-live-status" value="STATE: [OFF]\nClick buttons to inject current." position="-0.68 0.1 0.01" width="1.3" color="#0369a1" baseline="top"></a-text>
      </a-plane>
    </a-entity>

    <!-- VR RIG (Lets you walk around in VR & Desktop) -->
    <a-entity id="rig" movement-controls="fly: false; speed: 0.14" position="0 0 0.3">
      <a-entity id="camera" camera position="0 1.6 0" look-controls>
        <a-cursor id="cursor" raycaster="objects: .clickable" cursor="fuse: false" color="#38bdf8"></a-cursor>
      </a-entity>
      <!-- Hand Controllers with ray lasers -->
      <a-entity oculus-touch-controls="hand: left" laser-controls="hand: left" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
      <a-entity oculus-touch-controls="hand: right" laser-controls="hand: right" raycaster="objects: .clickable; lineColor: #38bdf8"></a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
